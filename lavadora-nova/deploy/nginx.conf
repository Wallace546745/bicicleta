# Nginx na frente do Node (porta 3000, só em 127.0.0.1).
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/lavadora
#   sudo sed -i 's/SEU_DOMINIO/loja.exemplo.com.br/g' /etc/nginx/sites-available/lavadora
#   sudo ln -sf /etc/nginx/sites-available/lavadora /etc/nginx/sites-enabled/lavadora
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SEU_DOMINIO      (HTTPS; o certbot reescreve este arquivo)
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO www.SEU_DOMINIO;
    # www -> domínio principal: um endereço só para o pixel, o canonical e o Google
    if ($host = www.SEU_DOMINIO) { return 301 https://SEU_DOMINIO$request_uri; }

    # o editor manda imagens em base64 (até 12 MB no Express)
    client_max_body_size 15m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # tempo real do painel (SSE): nada de buffer, conexão longa
    location /api/admin/monitor/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # tudo o mais: loja, /p/<produto>, /api, /webhooks, /admin
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real do comprador — o servidor usa no match do TikTok (x-real-ip / x-forwarded-for)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # nunca servir segredos/dados pelo nginx (o Express já bloqueia; dupla trava):
    # qualquer arquivo/pasta oculto (.git, .env), a pasta deploy/ e o backend
    location ~ /\. { return 404; }
    location ^~ /deploy/ { return 404; }
    location ~ ^/nerva/(data/|node_modules/|.*\.(js|json|md)$) { return 404; }
}
